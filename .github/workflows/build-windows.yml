name: Build Windows Executable (.exe)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Build .exe with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --console --name "SoHoa_VBCC" --add-data "template.xlsx;." main.py

    - name: Upload Artifact (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: SoHoa_VBCC_Windows_x64
        path: dist/SoHoa_VBCC.exe

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "SoHoa_VBCC - Bản phát hành Windows (.exe)"
        body: |
          ### 🚀 File thực thi Windows (.exe)
          - Tải trực tiếp file **`SoHoa_VBCC.exe`** ở mục **Assets** bên dưới.
          - Chạy trực tiếp trên Windows, không cần cài đặt Python.
        files: dist/SoHoa_VBCC.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
