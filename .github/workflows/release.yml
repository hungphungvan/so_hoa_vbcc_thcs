name: Build & Release SohoaTHCS (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Version
      shell: bash
      run: |
        echo "APP_VERSION = '1.0.${{ github.run_number }}'" > src/version.py
        echo "APP_NAME = 'SohoaTHCS'" >> src/version.py
        echo "GITHUB_REPO = 'hungphungvan/so_hoa_vbcc_thcs'" >> src/version.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Build .exe with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SohoaTHCS" --add-data "data;data" main.py

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SohoaTHCS_Windows
        path: dist/SohoaTHCS.exe

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Version
      shell: bash
      run: |
        echo "APP_VERSION = '1.0.${{ github.run_number }}'" > src/version.py
        echo "APP_NAME = 'SohoaTHCS'" >> src/version.py
        echo "GITHUB_REPO = 'hungphungvan/so_hoa_vbcc_thcs'" >> src/version.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Build macOS with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SohoaTHCS_macOS" --add-data "data:data" main.py
        cd dist
        if [ -d "SohoaTHCS_macOS.app" ]; then
          chmod -R +x SohoaTHCS_macOS.app/Contents/MacOS || true
          zip -r -y SohoaTHCS_macOS.zip SohoaTHCS_macOS.app

          # Tạo file cài đặt đĩa ảo DMG kéo thả vào Applications chuẩn macOS
          mkdir -p dmg_root
          cp -R SohoaTHCS_macOS.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "SohoaTHCS" -srcfolder dmg_root -ov -format UDZO SohoaTHCS_macOS.dmg
          rm -rf dmg_root
        else
          chmod +x SohoaTHCS_macOS || true
          zip -r SohoaTHCS_macOS.zip SohoaTHCS_macOS
        fi
        cd ..

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SohoaTHCS_macOS
        path: |
          dist/SohoaTHCS_macOS.zip
          dist/SohoaTHCS_macOS.dmg

  publish-release:
    name: Publish Multi-Platform Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Prepare release files
      run: |
        mkdir release_files
        cp SohoaTHCS_Windows/SohoaTHCS.exe release_files/
        cp SohoaTHCS_macOS/SohoaTHCS_macOS.zip release_files/
        cp SohoaTHCS_macOS/SohoaTHCS_macOS.dmg release_files/ || true
        ls -la release_files/

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: "SohoaTHCS v1.0.${{ github.run_number }} - Bản phát hành Windows & macOS"
        make_latest: true
        body: |
          ### 🚀 Tải về ứng dụng chạy trực tiếp (Không cần cài đặt Python) - Phiên bản v1.0.${{ github.run_number }}

          | Hệ điều hành | Tệp tải về | Hướng dẫn sử dụng |
          | :--- | :--- | :--- |
          | **Windows (x64)** | **`SohoaTHCS.exe`** | Tải về và click đúp để chạy trực tiếp trên Windows 10/11. |
          | **macOS (Khuyên dùng)** | **`SohoaTHCS_macOS.dmg`** | Tệp đĩa cài đặt chuẩn macOS: Mở tệp DMG và kéo ứng dụng vào thư mục Applications. |
          | **macOS (Bản Zip)** | **`SohoaTHCS_macOS.zip`** | Giải nén, click đúp file `SohoaTHCS_macOS.app` (hoặc nhị phân) để chạy. |

          ---
          > [!NOTE]
          > **Mẹo cho người dùng macOS lần đầu mở file:**
          > Nếu macOS hiển thị cảnh báo bảo mật Gatekeeper (*"Không thể mở ứng dụng vì chưa xác minh nhà phát triển"*):
          > 👉 Bạn chỉ cần **Click chuột phải** (hoặc giữ phím `Control` + Click) vào ứng dụng $\rightarrow$ chọn **Open (Mở)** $\rightarrow$ chọn tiếp **Open** là ứng dụng sẽ chạy bình thường (chỉ cần làm 1 lần đầu).
        files: |
          release_files/SohoaTHCS.exe
          release_files/SohoaTHCS_macOS.dmg
          release_files/SohoaTHCS_macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
