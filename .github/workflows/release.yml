name: Build & Release SohoaVB (Windows & macOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  get-version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
      tag_name: ${{ steps.set_version.outputs.tag_name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Determine Version
      id: set_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VER="${GITHUB_REF_NAME#v}"
        else
          VER=$(python3 -c "from src.version import APP_VERSION; print(APP_VERSION)")
        fi
        echo "version=${VER}" >> $GITHUB_OUTPUT
        echo "tag_name=v${VER}" >> $GITHUB_OUTPUT

  build-windows:
    name: Build Windows (.exe)
    needs: get-version
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Version
      shell: bash
      run: |
        VERSION="${{ needs.get-version.outputs.version }}"
        echo "APP_VERSION = '${VERSION}'" > src/version.py
        echo "APP_NAME = 'SohoaVB'" >> src/version.py
        echo "GITHUB_REPO = 'hungphungvan/so_hoa_vbcc_thcs'" >> src/version.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller certifi xlrd python-docx pywin32

    - name: Build .exe with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SohoaVB" --add-data "data;data" --hidden-import xlrd --hidden-import docx --hidden-import win32com --collect-all certifi main.py

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SohoaVB_Windows
        path: dist/SohoaVB.exe

  build-macos:
    name: Build macOS Application
    needs: get-version
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Inject Version
      shell: bash
      run: |
        VERSION="${{ needs.get-version.outputs.version }}"
        echo "APP_VERSION = '${VERSION}'" > src/version.py
        echo "APP_NAME = 'SohoaVB'" >> src/version.py
        echo "GITHUB_REPO = 'hungphungvan/so_hoa_vbcc_thcs'" >> src/version.py

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller certifi xlrd python-docx

    - name: Build macOS with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SohoaVB" --add-data "data:data" --hidden-import xlrd --hidden-import docx --collect-all certifi main.py
        cd dist
        if [ -d "SohoaVB.app" ]; then
          chmod -R +x SohoaVB.app/Contents/MacOS || true
          zip -r -y SohoaVB_macOS.zip SohoaVB.app

          # Tạo file cài đặt đĩa ảo DMG kéo thả vào Applications chuẩn macOS
          mkdir -p dmg_root
          cp -R SohoaVB.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "SohoaVB" -srcfolder dmg_root -ov -format UDZO SohoaVB_macOS.dmg
          rm -rf dmg_root
        else
          chmod +x SohoaVB || true
          zip -r SohoaVB_macOS.zip SohoaVB
        fi
        cd ..

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SohoaVB_macOS
        path: |
          dist/SohoaVB_macOS.zip
          dist/SohoaVB_macOS.dmg

  publish-release:
    name: Publish Multi-Platform Release
    needs: [get-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Prepare release files
      run: |
        mkdir release_files
        cp SohoaVB_Windows/SohoaVB.exe release_files/
        cp SohoaVB_macOS/SohoaVB_macOS.zip release_files/
        cp SohoaVB_macOS/SohoaVB_macOS.dmg release_files/ || true
        ls -la release_files/

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.get-version.outputs.tag_name }}
        name: "SohoaVB ${{ needs.get-version.outputs.tag_name }} - Bản phát hành Windows & macOS"
        make_latest: true
        body: |
          ### 🚀 Tải về ứng dụng chạy trực tiếp (Không cần cài đặt Python) - Phiên bản ${{ needs.get-version.outputs.tag_name }}

          | Hệ điều hành | Tệp tải về | Hướng dẫn sử dụng |
          | :--- | :--- | :--- |
          | **Windows (x64)** | **`SohoaVB.exe`** | Tải về và click đúp để chạy trực tiếp trên Windows 10/11. Tự động hỗ trợ High-DPI. |
          | **macOS (Khuyên dùng)** | **`SohoaVB_macOS.dmg`** | Tệp đĩa cài đặt chuẩn macOS: Mở tệp DMG và kéo ứng dụng vào thư mục Applications. |
          | **macOS (Bản Zip)** | **`SohoaVB_macOS.zip`** | Giải nén, click đúp file `SohoaVB.app` để chạy. |

          ---
          > [!NOTE]
          > **Mẹo cho người dùng macOS lần đầu mở file:**
          > Nếu macOS hiển thị cảnh báo bảo mật Gatekeeper (*"Không thể mở ứng dụng vì chưa xác minh nhà phát triển"*):
          > 👉 Bạn chỉ cần **Click chuột phải** (hoặc giữ phím `Control` + Click) vào ứng dụng $\rightarrow$ chọn **Open (Mở)** $\rightarrow$ chọn tiếp **Open** là ứng dụng sẽ chạy bình thường (chỉ cần làm 1 lần đầu).
        files: |
          release_files/SohoaVB.exe
          release_files/SohoaVB_macOS.dmg
          release_files/SohoaVB_macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
